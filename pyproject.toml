[project]
name = "pantry"
version = "2.0.0"
description = "Self hosted meal planner, shopping list and household pantry for the home server"
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["frontend", "app/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501", "B008", "SIM108", "SIM102", "SIM105", "B904", "UP035", "C408", "UP006", "UP045", "UP017", "UP032", "B905", "E731"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
known-first-party = ["app", "helpers"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:fastapi.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/web/*"]
